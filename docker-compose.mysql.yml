# DAGonWeb with MySQL. Standalone or as an overlay:
#   docker compose -f docker-compose.mysql.yml up --build
#   docker compose -f docker-compose.yml -f docker-compose.mysql.yml -f docker-compose.redis.yml up --build
# With the Redis overlay, put the same DATABASE_URL in .env so workers use it too.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root-password
      MYSQL_DATABASE: dagonweb
      MYSQL_USER: dagonweb
      MYSQL_PASSWORD: dagonweb
    volumes:
      - mysql-data:/var/lib/mysql
  dagonweb:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me}
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://dagonweb:dagonweb@db:3306/dagonweb}
      SCRATCH_DIR: /scratch/dagonweb
      ADMIN_EMAIL: admin@example.org
      ADMIN_PASSWORD: admin12345
      ADMIN_NAME: DAGonWeb Admin
    ports:
      - "8000:8000"
    volumes:
      - ./scratch:/scratch/dagonweb
    depends_on:
      - db
volumes:
  mysql-data:
