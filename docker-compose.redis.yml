# Redis execution backend: runs are queued on Redis and executed by workers.
#
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml \
#                  -f docker-compose.redis.yml up --build --scale worker=4
#
# Workers share the database and the scratch volume with the web service, so
# use PostgreSQL or MySQL (SQLite allows a single writer). Each worker runs one
# workflow at a time; scale the number of workers for concurrency.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  dagonweb:
    environment:
      DAGONWEB_EXECUTION_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  worker:
    image: ${DAGONWEB_IMAGE:-dagonweb:local}
    build: .
    command: ["sh", "-c", "sleep 5 && exec flask --app wsgi worker"]
    env_file:
      - path: .env
        required: false
    environment:
      SCRATCH_DIR: ${SCRATCH_DIR:-/scratch/dagonweb}
      DAGONWEB_EXECUTION_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./instance:/app/instance
      - ./scratch:/scratch/dagonweb
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
